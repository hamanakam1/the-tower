[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-tower"
version = "0.4.0"
description = "Hardware Air Traffic Control for the Autonomous Mesh"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Michael Hamanaka"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "psutil>=5.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
]

[project.scripts]
the-tower = "the_tower.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["the_tower*"]

[tool.setuptools.package-data]
the_tower = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
